<!doctype html><html lang="uk"><meta charset="utf-8"><title>Перевірка браузерної моделі</title><h1 id="verification">Перевіряємо ONNX і TFJS…</h1><pre id="details"></pre><script src="./vendor/ort.wasm.min.js"></script><script src="./vendor/tf.min.js"></script><script type="module">
import {loadModel,predict} from './engine.mjs?v=adaptive-1';
import {PersonalHead} from './personal-head.mjs';
try{
 const fixture=await fetch('./assets/parity.json').then(r=>r.json());
 const session=await loadModel();
 const output=await session.run({pixels:new ort.Tensor('float32',new Float32Array(fixture.inputs),fixture.shape)});
 const expected=fixture.expected.flat();let maxDifference=0;
 expected.forEach((v,i)=>maxDifference=Math.max(maxDifference,Math.abs(v-output.probabilities.data[i])));
 if(maxDifference>1e-5)throw Error('PyTorch/ONNX mismatch: '+maxDifference);
 const [initial,replay]=await Promise.all(['head-initial.json','head-replay.json'].map(name=>fetch('./assets/'+name).then(r=>r.json())));
 await tf.setBackend('cpu');await tf.ready();
 const head=new PersonalHead(tf,initial,replay);
 const features=Array.from({length:fixture.shape[0]},(_,i)=>Array.from(output.features.data.slice(i*64,i*64+64)));
 const headScores=head.predict(features);let maxHeadDifference=0;
 headScores.forEach((v,i)=>maxHeadDifference=Math.max(maxHeadDifference,Math.abs(v-output.probabilities.data[i])));
 head.dispose();if(maxHeadDifference>1e-5)throw Error('Initial TFJS/ONNX head mismatch: '+maxHeadDifference);
 const width=840,height=240,pixels=new Uint8Array(width*height);
 for(const left of [100,300,500])for(let y=50;y<190;y++)for(let x=left;x<left+16;x++)pixels[y*width+x]=255;
 const result=await predict(pixels,width,height);
 if(result.text!=='111'||!result.valid||result.digits.length!==3)throw Error('Expected111, got '+result.text);
 pixels.fill(0);
 for(const left of [70,210,350,490,630])for(let y=50;y<190;y++)for(let x=left;x<left+16;x++)pixels[y*width+x]=255;
 const longResult=await predict(pixels,width,height);
 if(longResult.text!=='11111'||!longResult.valid||longResult.digits.length!==5)throw Error('Expected11111, got '+longResult.text);
 document.getElementById('verification').textContent='PASS: ONNX + TFJS head + числа111 і11111';
 document.getElementById('details').textContent=JSON.stringify({maxDifference,maxHeadDifference,number:result.number,longNumber:longResult.number,digits:longResult.digits.length},null,2);
}catch(error){document.getElementById('verification').textContent='FAIL';document.getElementById('details').textContent=error.stack;}
</script></html>
